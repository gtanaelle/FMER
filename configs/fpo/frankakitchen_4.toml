[environment]
env = "FrankaKitchen-v1"
num_vec_envs = 1
env_tasks = ['bottom burner', 'light switch', 'slide cabinet', 'microwave']
nb_task = 4

[training]
alg = "fpo"
total_step = 1000000  # 1e6
start_step = 10000    # 3e4

[network]
diffusion_steps = 10

[logging]
use_wandb = true
wandb_project = "test"
wandb_entity = "MyDiffusionRL"
wandb_mode = "online"  # Options: online, offline, disabled