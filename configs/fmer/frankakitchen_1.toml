[environment]
env = "FrankaKitchen-v1"
num_vec_envs = 1
env_tasks = ['light switch']
nb_task = 1

[training]
alg = "gvpo"
total_step = 1e6  # 1e6
start_step = 1e4    # 3e4
lr = 3e-4

[network]
tau=0.5
num_particles = 8
hidden_num = 3
hidden_dim = 256
diffusion_steps = 10
diffusion_hidden_dim = 256

[logging]
use_wandb = true
wandb_project = "test"
wandb_entity = "MyDiffusionRL"
wandb_mode = "online"  # Options: online, offline, disabled